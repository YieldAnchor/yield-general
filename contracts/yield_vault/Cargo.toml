[package]
name = "yield_vault"
version = "0.1.0"
edition = "2021"

[lib]
name = "yield_vault"
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "21.7"

[dev-dependencies]
soroban-sdk = { version = "21.7", features = ["testutils"] }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
strip = true
