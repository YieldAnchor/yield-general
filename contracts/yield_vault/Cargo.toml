[package]
name = "yield_vault"
version = "0.1.0"
edition = "2021"

[lib]
name = "yield_vault"
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "22.0"

[dev-dependencies]
soroban-sdk = { version = "22.0", features = ["testutils"] }

# The release profile lives in the workspace-root Cargo.toml: Cargo ignores
# [profile.*] tables declared in a workspace member.
